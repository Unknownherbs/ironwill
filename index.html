<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF5EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ironwill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ironwill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ironwill v4. Warm paper, chunky tactile cards, colour-coded habit tiles.
   Fraunces (serif) for headlines and numbers, Figtree for everything else. */
:root{
  --h:14;--sm:1;--r:20px;--c:36;
  --fd:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  --bg:#FBF5EA;--paper:#FFFDF8;--sf2:#F3E9D6;
  --ink:#231C14;--tx:#231C14;--mu:#7A6E60;
  --line:#E7DAC3;--line2:#D2C0A0;
  --ac:hsl(var(--h) calc(86%*var(--sm)) 50%);
  --acd:hsl(var(--h) calc(80%*var(--sm)) 34%);
  --act:hsl(var(--h) calc(80%*var(--sm)) 38%);
  --acs:hsl(var(--h) calc(90%*var(--sm)) 93%);
  --on:#fff;
  --pbs:88%;--pbl:90%;--pss:78%;--psl:62%;--pfs:62%;--pfl:28%;--pls:50%;--pll:78%;
  --note:hsl(48 95% 87%);--noteb:hsl(46 70% 72%);--notet:#40320f;
  --sky1:#c4e3f7;--sky2:#eaf5ee;--gr1:#93cc82;--gr2:#62a867;
  --shadow:0 18px 36px rgba(80,55,15,.12);
  --sf:var(--paper);--bd:var(--line);--bd2:var(--line2);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  color-scheme:dark;
  --bg:#171210;--paper:#221B16;--sf2:#1B1511;
  --ink:#F7EEDF;--tx:#F7EEDF;--mu:#AD9F8D;
  --line:#372D24;--line2:#4C4033;
  --ac:hsl(var(--h) calc(88%*var(--sm)) 60%);
  --acd:hsl(var(--h) calc(80%*var(--sm)) 36%);
  --act:hsl(var(--h) calc(90%*var(--sm)) 72%);
  --acs:hsl(var(--h) 30% 19%);
  --on:#1d1409;
  --pbs:30%;--pbl:19%;--pss:72%;--psl:62%;--pfs:75%;--pfl:80%;--pls:28%;--pll:28%;
  --note:hsl(46 35% 21%);--noteb:hsl(46 30% 13%);--notet:#f2e7c4;
  --sky1:#16233f;--sky2:#1d3148;--gr1:#2e6a41;--gr2:#214f31;
  --shadow:0 18px 36px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171210;--paper:#221B16;--sf2:#1B1511;
  --ink:#F7EEDF;--tx:#F7EEDF;--mu:#AD9F8D;
  --line:#372D24;--line2:#4C4033;
  --ac:hsl(var(--h) calc(88%*var(--sm)) 60%);
  --acd:hsl(var(--h) calc(80%*var(--sm)) 36%);
  --act:hsl(var(--h) calc(90%*var(--sm)) 72%);
  --acs:hsl(var(--h) 30% 19%);
  --on:#1d1409;
  --pbs:30%;--pbl:19%;--pss:72%;--psl:62%;--pfs:75%;--pfl:80%;--pls:28%;--pll:28%;
  --note:hsl(46 35% 21%);--noteb:hsl(46 30% 13%);--notet:#f2e7c4;
  --sky1:#16233f;--sky2:#1d3148;--gr1:#2e6a41;--gr2:#214f31;
  --shadow:0 18px 36px rgba(0,0,0,.4);
}
/* per-element pastel set, keyed to --c */
.h,.cat,.mini,.stats>.card,.pack{
  --cbg:hsl(var(--c) var(--pbs) var(--pbl));
  --cst:hsl(var(--c) var(--pss) var(--psl));
  --cfg:hsl(var(--c) var(--pfs) var(--pfl));
  --cln:hsl(var(--c) var(--pls) var(--pll));
}
:root[data-am="off"] *,:root[data-am="off"] *::before,:root[data-am="off"] *::after{transition:none!important;animation:none!important}

/* base */
*{box-sizing:border-box;margin:0}
html{font-size:calc(16px*var(--fs,1));-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:500 1rem/1.5 var(--fb);min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
h1,h2,h3{text-wrap:balance}
h2{font:800 1.4rem/1.15 var(--fd);letter-spacing:-.015em}
h3{font:800 1.15rem/1.25 var(--fd);letter-spacing:-.01em}
.mu{color:var(--mu)}
small{color:var(--mu);font-size:.82rem;font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a.btn{text-decoration:none}
hr{border:0;border-top:2px solid var(--line)}
b{font-weight:800}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:2px 0 22px}
.top .tt{min-width:0}
.date{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);background:var(--sf2);padding:5px 12px;border-radius:99px;margin-bottom:12px}
h1{font:800 clamp(2.1rem,9.6vw,2.8rem)/1.02 var(--fd);letter-spacing:-.025em}
.av{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);background:var(--acs);box-shadow:0 3px 0 var(--line);font-size:1.6rem;line-height:1;display:grid;place-items:center;flex:none;transition:transform .12s,box-shadow .12s}
.av:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}

/* surfaces */
.card{background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:calc(var(--r)*1.25);padding:20px;margin-bottom:16px}
.card>p+p,.card p+.row{margin-top:8px}
.card h2+p,.card h3+p{margin-top:6px}
.card h3+.kv{margin-top:10px}
.nudge{background:var(--acs);border-color:color-mix(in srgb,var(--ac) 38%,var(--line));box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 38%,var(--line))}
.bar{height:12px;background:var(--sf2);border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--r)*1.7);padding:22px 22px 20px;margin-bottom:14px;background:var(--ac);color:#fff;box-shadow:0 6px 0 var(--acd)}
:root[data-theme="dark"] .hero,:root:not([data-theme]) .hero{color:#fff}
.hero::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.hero::after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.08);left:-46px;bottom:-60px}
.hero>*{position:relative;z-index:1}
.hero small{color:inherit}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.rk{display:inline-block;padding:5px 13px;border-radius:99px;background:#fff;color:var(--acd);font-size:.74rem;font-weight:800;letter-spacing:.04em;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.14)}
:root[data-theme="dark"] .rk{color:#3a1a0c}
.streak{display:flex;align-items:baseline;gap:12px;margin:16px 0 2px;font:800 clamp(5rem,27vw,7rem)/.8 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.streak span{font:800 .95rem/1.15 var(--fb);letter-spacing:0}
.hring{position:relative;width:112px;height:112px;flex:none}
.hring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.hring .t{stroke:rgba(255,255,255,.28)}
.hring .f{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.hring b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.55rem var(--fd);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hmsg{margin-top:14px;font-weight:800;font-size:1.02rem;max-width:30ch}
.week{display:flex;gap:8px;margin-top:20px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.gauge{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2);overflow:hidden}
.gauge i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*1%);background:rgba(255,255,255,.55);transition:height .6s}
.gauge.met i{background:#fff}
.gauge.rest{background:none;border:2px dashed rgba(255,255,255,.5)}
.gauge.rest i{display:none}
.wd small{font-size:.72rem;font-weight:800;opacity:.85}
.wd.now small{opacity:1}
.wd.now .gauge{outline:3px solid #fff;outline-offset:2px}

/* level + wallet tiles */
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:16px}
.mini{border-radius:calc(var(--r)*1.3);padding:16px 18px;background:var(--cbg);border:2px solid var(--cln);box-shadow:0 4px 0 var(--cln)}
.mini.lvl{--c:48}.mini.wal{--c:205}
.mini small{display:block;color:var(--cfg);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.68rem}
.mini b{display:block;font:800 2.4rem/1.05 var(--fd);letter-spacing:-.03em;color:var(--ink)}
.mini .bar{margin:10px 0 8px;background:rgba(255,255,255,.55);box-shadow:none}
.mini .xt{text-transform:none;letter-spacing:0;font-size:.76rem}
.mini.wal{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.mini.wal b{font-size:1.6rem}

.quote{margin:6px 2px 4px;padding:16px 18px;background:var(--note);color:var(--notet);border-radius:18px;transform:rotate(-.7deg);box-shadow:0 4px 0 var(--noteb)}
.quote b{display:block;font:700 1.15rem/1.35 var(--fd);font-style:italic;margin-bottom:6px;text-wrap:balance}
.quote small{display:block;color:inherit;opacity:.7}

/* section labels */
.cat{display:flex;align-items:center;gap:10px;margin:30px 2px 14px}
.cat span{font:800 1.2rem/1 var(--fd);letter-spacing:-.01em}
.cat span::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--cst);margin-right:10px;vertical-align:1px}
.cat em{margin-left:auto;font-style:normal;font-weight:800;font-size:.78rem;background:var(--cbg);color:var(--cfg);padding:4px 11px;border-radius:99px;font-variant-numeric:tabular-nums}

/* rows */
.grp{display:grid;gap:12px;margin-bottom:6px}
.grp>.card{margin:0}
.h{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:11px 14px 11px 11px;border-radius:calc(var(--r)*1.15);transition:transform .1s,box-shadow .1s,background .2s}
.h:active:not(.static){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.h .ic{font-size:1.4rem;line-height:1;width:46px;height:46px;display:grid;place-items:center;background:var(--cbg);border-radius:calc(var(--r)*.75);flex:none}
.h .nm{flex:1;min-width:0;font-weight:800;font-size:.97rem;line-height:1.3;overflow-wrap:anywhere}
.h .nm small{display:block;font-weight:600;font-size:.76rem;margin-top:2px}
.h b{white-space:nowrap;font-size:.78rem;font-weight:800;background:var(--cbg);color:var(--cfg);padding:6px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--line2);display:grid;place-items:center;color:transparent;background:var(--paper);transition:background .2s,border-color .2s}
.chk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.h.done{background:var(--cbg);border-color:var(--cln);box-shadow:0 4px 0 var(--cln)}
.h.done .chk{background:var(--ink);border-color:var(--ink);color:var(--paper);animation:pop .4s}
.h.done .nm>span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.h.lock{opacity:.5}
.h.static{cursor:default}
.h.pend{outline:2px dashed var(--ac);outline-offset:-2px}
.h.pend .chk{border-style:dashed;border-color:var(--ac);color:var(--ac);font-weight:800}
[data-dense="1"] .h{padding:7px 12px 7px 8px}
[data-dense="1"] .h .ic{width:34px;height:34px;font-size:1.1rem}
[data-dense="1"] .h .nm small{display:inline;margin-left:8px}
@keyframes pop{50%{transform:scale(1.35)}}
.tag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:6px;background:var(--acs);color:var(--act);font-size:.7rem;font-weight:800;line-height:1.6;white-space:nowrap;vertical-align:1px}

/* habit tiles */
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles>.card{grid-column:1/-1}
.tiles .h{flex-direction:column;align-items:flex-start;gap:0;min-height:140px;padding:14px;position:relative;background:var(--cbg);border-color:var(--cln);box-shadow:0 5px 0 var(--cln)}
.tiles .h:active:not(.static){box-shadow:0 2px 0 var(--cln)}
.tiles .h .ic{width:auto;height:auto;background:none;font-size:2.4rem;border-radius:0;margin-bottom:12px;display:block;transform-origin:left bottom;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tiles .h .nm{flex:none;width:100%;margin-top:auto;font-size:.96rem;padding-right:4px}
.tiles .h .nm small{color:var(--cfg)}
.tiles .h .chk{position:absolute;top:12px;right:12px;border-color:var(--cln)}
.tiles .h.done{background:var(--cst);border-color:var(--cfg);box-shadow:0 5px 0 var(--cfg);color:#21170a}
.tiles .h.done .nm small{color:inherit;opacity:.75}
.tiles .h.done .nm>span{text-decoration:none;opacity:1}
.tiles .h.done .chk{background:#21170a;border-color:#21170a;color:#fff}
.tiles .h.done .ic{transform:scale(1.14) rotate(-7deg)}
.tiles .h.pend{outline-offset:-5px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:var(--on);border:0;border-radius:calc(var(--r)*.85);padding:12px 22px;min-height:50px;font-weight:800;font-size:.96rem;text-align:center;box-shadow:0 4px 0 var(--acd);transition:transform .1s,box-shadow .1s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acd)}
.btn:hover{filter:brightness(1.05)}
.btn.g{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.g:active{box-shadow:0 1px 0 var(--line)}
.btn.big{width:100%;min-height:58px;margin-top:16px;border-radius:var(--r);font-size:1.04rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row.c{justify-content:center}
.pill{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:800;font-size:.86rem;box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s,background .15s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 40%,transparent)}
.pill:disabled{opacity:.42;cursor:default}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.seg{display:flex;gap:4px;padding:5px;background:var(--sf2);border:2px solid var(--line);border-radius:calc(var(--r)*1.1);margin-bottom:20px}
.seg button{flex:1;border:2px solid transparent;background:none;padding:9px 6px;border-radius:calc(var(--r)*.85);font-weight:800;font-size:.86rem;color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;background:var(--paper);border:2px solid var(--line);border-radius:calc(var(--r)*.7);padding:12px 14px;color:var(--tx);font:inherit;font-weight:600;transition:border-color .15s,box-shadow .15s}
input[type=number]{width:96px}
input[type=time]{width:auto}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.65}
input[type=range]{width:100%;accent-color:var(--ac);padding:0}
input[type=file]{width:100%;font:inherit;color:var(--mu)}
select option{color:#111;background:#fff}
textarea{resize:vertical;min-height:64px}
label{display:block;color:var(--mu);font-size:.84rem;margin:20px 0 8px;font-weight:800;letter-spacing:.01em}
label.inl{display:inline;margin:0}
.hint{color:var(--mu);font-size:.8rem;margin-top:10px;font-weight:600}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm>div{min-width:0}
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.emgrid button{aspect-ratio:1;border-radius:calc(var(--r)*.7);border:2px solid var(--line);background:var(--paper);font-size:1.3rem;line-height:1;box-shadow:0 3px 0 var(--line)}
.emgrid button.on{background:var(--acs);border-color:var(--ac);box-shadow:0 3px 0 var(--ac)}
.days{display:flex;gap:7px;flex-wrap:wrap}
.days .pill{padding:8px 13px}
.swatch{width:100%;height:48px;padding:3px;border-radius:calc(var(--r)*.7);border:2px solid var(--line);background:var(--paper)}
.thumb{display:block;max-width:100%;max-height:180px;border-radius:calc(var(--r)*.7);margin:8px 0}
.rem{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:2px dashed var(--line)}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv b{text-align:right;font-variant-numeric:tabular-nums;max-width:60%;overflow-wrap:anywhere}

/* today extras */
.moods{display:flex;gap:8px;margin:12px 0}
.moods button{flex:1;font-size:1.6rem;padding:11px 0;border-radius:calc(var(--r)*.85);border:2px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line);transition:transform .1s}
.moods button:active{transform:translateY(2px)}
.moods button.on{background:var(--acs);border-color:var(--ac);box-shadow:0 3px 0 var(--ac)}
.q{display:flex;align-items:center;gap:12px;margin:12px 0}
.q .qt{flex:1;font-weight:700;font-size:.94rem}
.q.ok .qt{opacity:.5;text-decoration:line-through}
.qb{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.qb svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.qb.rdy{border-color:var(--ac)}
.qb.ok{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.goal{display:flex;justify-content:space-between;gap:10px;align-items:center}
.goal b{font-size:1rem;color:var(--act)}
.boss{display:flex;gap:16px;align-items:center}
.boss .big{font-size:2.7rem;line-height:1}
.boss .bar{height:12px;margin-top:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{font-size:1.4rem;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line)}
.avs button.on{background:var(--acs);border-color:var(--ac);box-shadow:0 3px 0 var(--ac)}

/* intro */
.intro{position:relative;overflow:hidden;color:#fff;border-radius:calc(var(--r)*2);padding:40px 26px 30px;margin:8px 0 18px;background:var(--ac);box-shadow:0 7px 0 var(--acd)}
.intro::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14);right:-80px;top:-100px}
.intro::after{content:'🔥  💪  📚  🌱';position:absolute;right:18px;bottom:16px;font-size:1.5rem;letter-spacing:.2em;transform:rotate(-4deg)}
.intro>*{position:relative;z-index:1}

 if(left<=0&&tmr){clearInterval(tmr);tmr=null;ambStop();const d=dk();S.focus[d]=(S.focus[d]||0)+fDur;S.water+=2;gain(fDur+10,'Focus complete');notify('Focus complete','Nice work. '+fDur+' minutes done.');fx(['🎯','✨','⭐']);if(tab==='focus')render()}}
function tickU(){const left=Math.max(0,Math.round((uEnd-Date.now())/1000)),e=$('#ut');if(e)e.textContent=fmt(left);
 if(left<=0&&urgeT){clearInterval(urgeT);urgeT=null;const d=dk(),n=S.uday[d]=(S.uday[d]||0)+1;S.urges++;S.water++;gain(n<=3?15:0,'Urge beaten');notify('Urge beaten','You waited it out. Well done.');if(tab==='focus')render()}}

   else{const h=S.habits.find(x=>x.id===DR.id);if(h){h.c=name.slice(0,60);h.e=DR.e;h.cat=DR.cat;h.xp=DR.xp;h.d=days;h.v=DR.v?1:0}}
   editing=null;DR=null;save();render();toast('Habit saved');break}
  case'hdel':twostep('hdel',()=>{S.habits=S.habits.filter(x=>x.id!==DR.id);editing=null;DR=null;save();render();toast('Habit removed')});break;
  case'hue':S.hue=+ds.v;look();save();render();break;

   const fail=()=>{bkText=j;render();const t=$('#bk');if(t){t.focus();t.select()}toast('Select and copy the text below')};
   try{navigator.clipboard.writeText(j).then(()=>toast('Backup copied'),fail)}catch(e){fail()}break}
  case'restore':restoreText($('#bk').value);break;
  case'install':{if(!deferredInstall)break;const ev=deferredInstall;ev.prompt();Promise.resolve(ev.userChoice).then(r=>{deferredInstall=null;if(r&&r.outcome==='accepted')toast('Installing Ironwill');render()},()=>{deferredInstall=null;render()});break}
  case'installno':installNo=true;render();break;
  case'paste':{const t=$(ds.t);if(!t)break;try{navigator.clipboard.readText().then(v=>{t.value=v;toast('Pasted')},()=>{t.focus();toast('Long-press the box and choose Paste')})}catch(e){t.focus();toast('Long-press the box and choose Paste')}break}
  case'nsw':{if(S.ns){S.ns=false;save();render();break}if(!('Notification' in window))return toast('This browser has no alerts. Use the calendar reminders');Notification.requestPermission().then(p=>{S.ns=p==='granted';save();render();toast(S.ns?'Timer alerts on':'Alerts were blocked in browser settings')});break}
  case'rtg':{const k={m:'tm',e:'te',s:'ts'}[ds.v];if(k){S.rm[k]=S.rm[k]?0:1;save();render()}break}
  case'ics':if(dlFile('Ironwill-reminders.ics','text/calendar',buildIcs()))toast('Open the file to add the reminders');break;
  case'share':{const t=SH[ds.i];if(!t||!navigator.share)break;const f=ds.i.startsWith('rq')&&PROOF[ds.i.slice(2)]&&PROOF[ds.i.slice(2)].file;
   try{if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({text:t,files:[f]}).catch(()=>{});break}}catch(e){}
   navigator.share({text:t}).catch(()=>{});break}
  case'chest':{const d=dk();if(S.chest===d||pct(d)<S.thr-1e-9)break;S.chest=d;S.chests++;const m=lootRoll();chime(1);fx(['🎁','✨','💰']);save();render();toast('Chest: '+m);break}
  case'boss':{const cw=curWeek();if(S.bw===cw||weekXp(cw)<bossT())break;S.bw=cw;S.bosses++;S.coins+=100;chime(1);fx(['🗡️','💥','🏆']);save();render();toast('Boss defeated. +100 coins');break}
  case'preset':{const p=PRESETS[+ds.v];if(!p)break;Object.assign(S,{bl:18,op:100,bdw:1,sd:100,sp:100,ck:'circle',ics:'tile'},{hue:p[1],sm:p[2],tm:p[3],bgs:p[4],cs:p[5],rad:p[6],font:p[7]},p[8]||{});S=norm(S);look();save();render();break}
  case'bgs':S.bgs=ds.v;look();save();render();break;
  case'cs':S.cs=ds.v;look();save();render();break;
  case'theme':{const t=THEMES[+ds.v];if(!t)break;S.hue=t[1];S.sm=t[2];S.tm=t[3];S=norm(S);look();save();render();break}
  case'opt':{if(!['nv','ck','lay','ics','am','mw','amb','font','bgs','cs'].includes(ds.k))break;S[ds.k]=ds.v;S=norm(S);look();save();if(ds.k==='amb'&&tmr)ambStart();render();break}
  case'mood':{const v=+ds.v;if(!(v>=1&&v<=5))break;S.mood[dk()]=v;save();render();break}
  case'qclaim':{const i=+ds.v,d=dk(),got=S.qd[d]=S.qd[d]||[];if(got.includes(i)||!todayQ().includes(i)||!QP[i]||!QP[i][1](qctx()))break;
   got.push(i);S.coins+=20;let m='Quest done. +20 coins';if(got.length>=3){S.coins+=30;m='Quest sweep! +50 coins';fx(['🏅','✨','🎉'])}
   Object.keys(S.qd).sort().slice(0,-14).forEach(k=>delete S.qd[k]);chime(1);save();render();toast(m);break}
  case'rwadd':{const n=($('#rwn').value||'').trim().slice(0,40),c=Math.round(+$('#rwc').value);if(!n||!(c>=10))return toast('Enter a reward and a cost of at least 10 coins');if(S.rw.length>=30)return toast('That is plenty of rewards');S.rw.push({n,c});save();render();break}

  case'av':S.av=ds.v;save();render();break;
  case'gadd':{const n=($('#gn').value||'').trim().slice(0,40),d=$('#gd').value;if(!n||!/^\d{4}-\d\d-\d\d$/.test(d||''))return toast('Enter a goal name and a date');if(S.goals.length>=10)return toast('Ten goals is the limit');S.goals.push({n,d});S.goals.sort((a,b)=>a.d.localeCompare(b.d));save();render();break}
  case'gdel':S.goals.splice(+ds.i,1);save();render();break;
  case'bgclr':S.bgi='';if(S.bgs==='image')S.bgs='aurora';look();save();render();break;
  case'sn':S.sn=!S.sn;save();render();chime(1);break;
  case'bkdl':if(dlFile('ironwill-backup-'+dk()+'.json','application/json',JSON.stringify(S))){S.lbk=new Date().toISOString();save();render();toast('Backup saved to your Downloads')}break;
  case'savecopy':saveCopy();break;
  case'bm':bm=ds.v;render();break;
  case'tm':S.tm=ds.v;look();save();render();break;
  case'hp':S.hp=!S.hp;save();render();break;

  case'copyreq':{const pe=S.pend[dk()]&&S.pend[dk()][ds.id],x=S.habits.find(h=>h.id===ds.id);if(pe&&x)copyText(reqMsg(x,pe),'Request copied. Send it with your proof','#preq');break}

   if(!S.vs.includes(CF.k)){S.vs.push(CF.k);S.vc++}

const app=$('#app'),nav=$('#nav');
function onClick(e){const t=e.target.closest('[data-a]');if(!t||t.disabled)return;act(t.dataset.a,t.dataset)}

function hex2hsl(hx){const m=/^#([0-9a-f]{6})$/i.exec(hx);if(!m)return null;const n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
 if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}
 const l=(mx+mn)/2,sa=d?d/(1-Math.abs(2*l-1)):0;return{h,s:Math.round(sa*100)}}
const SL={ssm:['sm',40,150],srad:['rad',4,34],sfs:['fs',88,130],sbl:['bl',0,40],sop:['op',20,200],sbw:['bdw',0,3],ssd:['sd',0,200],ssp:['sp',60,150],sdim:['dim',0,90]};
app.addEventListener('input',e=>{
 const id=e.target.id,v=e.target.value;
 if(SL[id]){const c=SL[id];S[c[0]]=Math.min(c[2],Math.max(c[1],+v||c[1]));look();return}
 if(id==='pnote'&&proofOpen){PROOF[proofOpen]=PROOF[proofOpen]||{note:'',url:''};PROOF[proofOpen].note=v;return}
 if(id==='hf-n'&&DR)DR.c=v;
 else if(id==='wn'){S.name=v.slice(0,20)}
 else if(id==='hs'){S.hue=+v;look()}
});
app.addEventListener('change',e=>{
 const id=e.target.id,v=e.target.value;
 if(SL[id]){const c=SL[id];S[c[0]]=Math.min(c[2],Math.max(c[1],+v||c[1]));look();save();render();return}
 if(id==='scol'){const c=hex2hsl(v);if(c){S.hue=c.h;S.sm=Math.min(150,Math.max(40,Math.round(c.s/62*100)));look();save();render()}return}
 if(id==='pnote'){render();return}
 if(id==='jr'){const t=v.slice(0,300);if(t.trim())S.jr[dk()]=t;else delete S.jr[dk()];save();render();return}
 if(id==='sti'){S.ti=v;save();render();return}
 if(id==='bgimg'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.6);if(u.length>690000)return toast('That image is too large. Try a smaller one');S.bgi=u;S.bgs='image';look();save();render()}catch(x){toast('Could not use that image')}};im.onerror=()=>toast('That is not an image I can read');im.src=String(r.result)};r.readAsDataURL(f);return}
 if(id==='pimg'&&proofOpen){const f=e.target.files&&e.target.files[0];if(f){const o=PROOF[proofOpen]=PROOF[proofOpen]||{note:'',url:''};try{if(o.url)URL.revokeObjectURL(o.url);o.url=URL.createObjectURL(f)}catch(x){o.url=''}o.file=f;render()}return}
 if(id==='bkf'){const f=e.target.files&&e.target.files[0];if(f){const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.onerror=()=>toast('Could not read that file');r.readAsText(f)}return}
 if(id==='hf-c'&&DR)DR.cat=v;
 else if(id==='hf-x'&&DR)DR.xp=+v;
 else if(id==='fc'){fcus=Math.min(180,Math.max(5,+v||25));render()}
 else if(id==='sn'){S.name=v.trim().slice(0,20);save();render()}
 else if(id==='sm'){S.mantra=v.slice(0,200);save()}
 else if(id==='hs'){S.hue=+v;save();render()}
 else if(id==='sth'){S.thr=+v;save();render()}
 else if(id==='sws'){S.ws=+v;save();render()}
 else if(/^rm-[mes]$/.test(id)){if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){S.rm[id.slice(3)]=v;save()}}
 else if(id==='svn'){S.vn=+v===2?2:1;save();render()}
 else if(id==='sud'){S.ud=+v;save();render()}
 else if(id==='ssw'){S.swaps=v.split('\n').map(x=>x.trim().slice(0,40)).filter(Boolean).slice(0,20);save();render()}
});
